    DSLR shallow depth of field, no perfect retouched skin, no styled background, no fashion photography, no magazine cover
    quality, no BARUBT branding, no other clay stick brands, no fake distorted product label, no extra fingers, no AI artifacts,
    no watermarks, no overlay text, no headlines, no captions.'
