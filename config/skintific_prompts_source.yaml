# =============================================================================
# SKINTIFIC ALASKA VOLCANO PORE CLAY STICK
# 50 Meta Feed Ad Creatives (1:1, 1080x1080)
# =============================================================================
# Source: user-supplied. This is the original strategic brief, kept verbatim.
# The bulk pipeline reads the flattened version at config/skintific_prompts.yaml.
# =============================================================================

global_settings:
  aspect_ratio: "1:1"
  resolution: "1080x1080"
  product_image: "inputs/products/alaska_volcano_stick.png"
  brand_lock: "Skintific Alaska Volcano Pore Clay Stick, gray cylindrical stick, white label with 'SKINTIFIC ALASKA VOLCANO' text, 40g/1.41 FL.OZ"
  negative_prompt: "no BARUBT branding, no other clay stick brands, no fake text, no distorted product label, no extra fingers, no AI artifacts, no watermarks"
  style_base: "professional product photography, Meta feed ad aesthetic, sharp focus on product, commercial quality"

# AVATAR 1: EFFICIENT PERFECTIONIST (17 images, 28-42, urban professional)
avatar_1_efficient_perfectionist:

  # COMPLIANT (10)
  - id: "ep_compliant_01"
    angle: "10-minute timer hero"
    prompt: "Modern minimalist bathroom counter, marble surface, the Skintific Alaska Volcano clay stick standing upright next to a sleek digital timer showing '10:00', morning light from window, neutral beige and white tones, MacBook visible blurred in background suggesting work-from-home, text overlay space at top, clean composition, 1:1 aspect ratio"
    text_overlay_suggestion: "10 minutes. That's it."

  - id: "ep_compliant_02"
    angle: "Coffee + skincare multitask"
    prompt: "Woman 32 years old wearing white silk pajamas applying clay stick to her face in modern kitchen, espresso machine brewing in background, minimal makeup, natural confidence, soft morning light, neutral palette, the Skintific gray clay stick visible in her hand, 1:1 composition"
    text_overlay_suggestion: "While my coffee brews."

  - id: "ep_compliant_03"
    angle: "Calendar overlay efficiency"
    prompt: "Flatlay overhead shot on white desk: Skintific Alaska Volcano clay stick, open paper planner with handwritten schedule, sleek black pen, small cup of matcha, gold watch, clean Scandinavian aesthetic, soft daylight, 1:1 aspect ratio"
    text_overlay_suggestion: "Skincare that fits the schedule."

  - id: "ep_compliant_04"
    angle: "Application technique close-up"
    prompt: "Extreme close-up of woman's hand holding Skintific clay stick applying smooth gray clay line on cheek, professional studio lighting, focus on technique and product texture, clean white background, hand model with neutral manicure, 1:1 composition"
    text_overlay_suggestion: "Glides on. No mess."

  - id: "ep_compliant_05"
    angle: "Esthetician authority"
    prompt: "Woman 35 in white esthetician uniform in clean modern spa setting, holding Skintific Alaska Volcano clay stick toward camera, soft professional lighting, slight smile, hair pulled back, looks like trusted skincare expert, neutral background, 1:1"
    text_overlay_suggestion: "What I actually recommend."

  - id: "ep_compliant_06"
    angle: "Desk drawer essentials"
    prompt: "Open office desk drawer flat-lay shot from above: Skintific clay stick alongside AirPods, lipstick, hand cream, mints, organized minimalist style, polished walnut drawer, soft top-down lighting, 1:1 composition"
    text_overlay_suggestion: "Office bag essentials."

  - id: "ep_compliant_07"
    angle: "Bathroom shelf curation"
    prompt: "Minimalist bathroom shelf with curated skincare lineup: Skintific Alaska Volcano clay stick prominently in center, surrounded by 4-5 high-end neutral-toned skincare bottles, marble shelf, soft window light, spa-like aesthetic, 1:1"
    text_overlay_suggestion: "The shelf earned its spot."

  - id: "ep_compliant_08"
    angle: "Texture swatch macro"
    prompt: "Macro photography of gray Skintific Alaska Volcano clay swatch on clean white surface, smooth creamy texture visible, the clay stick laying next to swatch, soft directional lighting showing material quality, no skin visible, just product, 1:1"
    text_overlay_suggestion: "Smoother than it looks."

  - id: "ep_compliant_09"
    angle: "Side-by-side format comparison"
    prompt: "Split composition: left side shows messy traditional clay mask jar with brush and clay scattered on counter, right side shows clean Skintific clay stick standing tall on pristine surface, dramatic lighting contrast between chaos and order, 1:1 aspect ratio"
    text_overlay_suggestion: "Same idea. Better execution."

  - id: "ep_compliant_10"
    angle: "Subtle confidence portrait"
    prompt: "Woman 38 with clear skin in soft turtleneck, holding Skintific clay stick casually near her face, warm natural lighting, content expression not exaggerated smile, professional but approachable, blurred home office background, 1:1"
    text_overlay_suggestion: "10 minutes I don't skip."

  # AGGRESSIVE (7)
  - id: "ep_aggressive_01"
    angle: "Timer countdown urgency"
    prompt: "Dramatic dark bathroom scene, woman 30 with mask applied checking large red digital countdown timer showing '00:30', moody lighting, intense focus on results timing, Skintific clay stick visible on counter, 1:1"
    text_overlay_suggestion: "30 seconds left until clear pores."

  - id: "ep_aggressive_02"
    angle: "Before/after split (subtle)"
    prompt: "Side-by-side split portrait of same woman 35: left side shows visible enlarged pores on nose area in harsh lighting, right side shows refined smooth nose skin in soft lighting, both photos professional quality, Skintific clay stick centered between, 1:1"
    text_overlay_suggestion: "Pores. Refined."

  - id: "ep_aggressive_03"
    angle: "Power morning routine reveal"
    prompt: "Aerial shot of bathroom counter: Skintific clay stick at center surrounded by power-routine items - black coffee, supplements, planner with red checkmarks, dark moody lighting with single overhead light, 1:1"
    text_overlay_suggestion: "Non-negotiables."

  - id: "ep_aggressive_04"
    angle: "Pore close-up extraction style"
    prompt: "Extreme macro of cheek skin showing visible pores being treated with gray clay coverage, Skintific stick applying clay to skin, scientific clean aesthetic, dramatic side lighting emphasizing texture, 1:1"
    text_overlay_suggestion: "Goes deep."

  - id: "ep_aggressive_05"
    angle: "Stress to glow narrative"
    prompt: "Split scene: left shows woman exhausted at computer late at night with stressed skin, right shows same woman next morning with clear glowing skin holding Skintific clay stick, transformation feel, 1:1"
    text_overlay_suggestion: "Burned out → bounced back."

  - id: "ep_aggressive_06"
    angle: "Result-driven testimonial frame"
    prompt: "Woman 33 holding Skintific clay stick close to camera with confident look, beautifully clear skin in foreground sharp focus, magazine-quote-style typography space on right side, professional editorial lighting, 1:1"
    text_overlay_suggestion: "I stopped getting facials."

  - id: "ep_aggressive_07"
    angle: "Premium ritual mood"
    prompt: "Dark luxurious bathroom, single candle lit, Skintific clay stick on black marble next to crystal water glass, dramatic chiaroscuro lighting, premium spa aesthetic, sense of indulgence, 1:1"
    text_overlay_suggestion: "10 minutes. For me."

